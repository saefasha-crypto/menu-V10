<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V10 Cafe | المنيو</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');

  :root{
    --bg:#0b0d0b;
    --bg-soft:#111510;
    --card:#151a16;
    --card-hover:#1b211c;
    --olive:#66734b;
    --olive-dark:#3f4b2e;
    --gold:#c9a45c;
    --gold-soft:#e2c98e;
    --cream:#f5f0e5;
    --muted:#a7aa9f;
    --line:rgba(245,240,229,.10);
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(circle at 50% -12%,rgba(102,115,75,.18),transparent 38%),
      linear-gradient(180deg,#0d100d 0%,#080908 100%);
    color:var(--cream);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(rgba(245,240,229,.028) 1px,transparent 1px);
    background-size:28px 28px;
  }

  /* HERO */
  .hero{
    position:relative;z-index:1;text-align:center;
    padding:34px 18px 30px;min-height:320px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .hero .pips{display:none}
  .hero .frame{
    width:190px;height:190px;margin:0 auto 18px;padding:3px;
    border-radius:30px;
    background:linear-gradient(145deg,var(--gold-soft),var(--gold),rgba(201,164,92,.35));
    box-shadow:0 20px 55px rgba(0,0,0,.58),0 0 0 1px rgba(201,164,92,.10);
  }
  .hero .frame .inner{
    width:100%;height:100%;border-radius:27px;overflow:hidden;background:#050605;
  }
  .hero .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .hero h1{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:clamp(30px,7vw,48px);letter-spacing:5px;
    color:var(--cream);background:none;-webkit-text-fill-color:initial;
  }
  .hero p.tag{margin-top:6px;color:var(--muted);font-size:14px}
  .hero .divider{display:flex;align-items:center;gap:10px;margin:17px auto 0;width:190px}
  .hero .divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .hero .divider .line.rev{background:linear-gradient(90deg,var(--gold),transparent)}
  .hero .divider .diamond{
    width:7px;height:7px;transform:rotate(45deg);
    border:1px solid var(--gold);background:var(--olive);
  }

  /* TABS */
  .tabs{
    position:sticky;top:0;z-index:10;
    display:flex;gap:8px;overflow-x:auto;padding:11px 14px;
    background:rgba(11,13,11,.88);backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{
    flex:0 0 auto;padding:10px 19px;border-radius:999px;
    border:1px solid rgba(245,240,229,.10);
    background:rgba(245,240,229,.025);
    color:#aaa99f;font-family:'Tajawal';font-weight:700;font-size:13px;
    cursor:pointer;transition:.22s;white-space:nowrap;
  }
  .tab-btn:hover{border-color:rgba(102,115,75,.65);color:var(--cream)}
  .tab-btn.active{
    background:linear-gradient(135deg,var(--olive),var(--olive-dark));
    color:#f4f0e6;border-color:rgba(201,164,92,.45);
    box-shadow:0 6px 20px rgba(0,0,0,.30);
  }

  /* MENU */
  .menu-wrap{
    position:relative;z-index:1;max-width:760px;margin:0 auto;
    padding:28px 16px 100px;
  }
  .category{margin-bottom:38px}
  .category-title{display:flex;align-items:center;gap:10px;margin-bottom:5px}
  .category-title .die{
    width:28px;height:28px;border-radius:8px;flex-shrink:0;
    background:linear-gradient(145deg,var(--olive),var(--olive-dark));
    border:1px solid rgba(201,164,92,.65);
    display:grid;grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);padding:4px;gap:1px;
  }
  .category-title .die i{border-radius:50%}
  .category-title .die i.on{background:var(--gold-soft)}
  .category-title h2{
    font-family:'Fraunces',serif;color:var(--cream);font-size:22px;
  }
  .category-title .line{
    flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);
  }
  .category-note{
    display:inline-block;font-size:11px;color:#c9cfba;
    margin:8px 0 13px 38px;padding:5px 11px;border-radius:999px;
    background:rgba(102,115,75,.14);
    border:1px solid rgba(102,115,75,.28);
  }

  /* ITEM */
  .item-row{
    display:flex;align-items:center;gap:10px;
    margin:7px 0;padding:13px 11px;
    border:1px solid rgba(245,240,229,.07);
    border-radius:15px;
    background:linear-gradient(90deg,rgba(21,26,22,.94),rgba(14,17,14,.88));
    transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;
    cursor:pointer;
  }
  .item-row:hover{
    transform:translateY(-2px);
    border-color:rgba(102,115,75,.48);
    background:linear-gradient(90deg,rgba(27,33,28,.98),rgba(16,20,16,.92));
    box-shadow:0 8px 22px rgba(0,0,0,.25);
  }
  .item-name{
    order:1;font-weight:700;font-size:15px;color:var(--cream);white-space:nowrap;
  }
  .leader{
    order:2;flex:1;border-bottom:1px dotted rgba(245,240,229,.13);
    transform:translateY(-1px);
  }
  .price-chip{
    order:3;min-width:62px;height:35px;padding:0 10px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;
    background:rgba(201,164,92,.08);
    border:1px solid rgba(201,164,92,.45);
    color:var(--gold-soft);font-family:'Fraunces',serif;font-weight:700;
    font-size:15px;white-space:nowrap;flex-shrink:0;
  }
  .price-chip span{
    font-family:'Tajawal';font-size:9px;margin-right:3px;opacity:.72;
  }
  .add-hint{
    order:4;width:35px;height:35px;flex:0 0 35px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(102,115,75,.65);
    background:linear-gradient(145deg,var(--olive),var(--olive-dark));
    color:#f8f5eb;font-size:22px;font-weight:500;line-height:1;
    box-shadow:0 5px 13px rgba(0,0,0,.25);
    transition:.18s;
  }
  .item-row:hover .add-hint{
    border-color:rgba(201,164,92,.7);
    background:linear-gradient(145deg,#738158,#4d5b38);
  }

  /* CART */
  .cart-fab{
    position:fixed;right:18px;bottom:18px;z-index:30;
    width:62px;height:62px;border-radius:20px;
    border:1px solid rgba(201,164,92,.55);
    background:linear-gradient(145deg,var(--olive),var(--olive-dark));
    color:var(--cream);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 14px 34px rgba(0,0,0,.55);
  }
  .cart-icon{font-size:25px}
  .cart-count{
    position:absolute;top:-6px;left:-6px;min-width:24px;height:24px;
    border-radius:50%;background:var(--gold);color:#17170f;
    font-size:12px;font-weight:900;display:none;align-items:center;
    justify-content:center;border:2px solid var(--bg);
  }
  .cart-count.show{display:flex}
  .cart-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.70);
    backdrop-filter:blur(6px);z-index:40;opacity:0;
    pointer-events:none;transition:.25s;
  }
  .cart-overlay.open{opacity:1;pointer-events:auto}
  .cart-drawer{
    position:fixed;top:0;left:0;height:100%;width:min(430px,94vw);z-index:41;
    background:linear-gradient(180deg,#171d17,#090b09 78%);
    border-right:1px solid rgba(201,164,92,.45);
    box-shadow:20px 0 60px rgba(0,0,0,.65);
    transform:translateX(-105%);transition:.3s;
    display:flex;flex-direction:column;
  }
  .cart-drawer.open{transform:translateX(0)}
  .cart-head{
    padding:20px 18px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .cart-head h3{color:var(--cream);font-size:20px}
  .cart-close{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:rgba(245,240,229,.04);
    color:var(--cream);cursor:pointer;font-size:20px;
  }
  .cart-items{flex:1;overflow:auto;padding:12px 16px}
  .cart-empty{text-align:center;color:var(--muted);padding:55px 20px}
  .cart-item{
    display:grid;grid-template-columns:1fr auto;gap:8px;padding:13px 0;
    border-bottom:1px dashed var(--line);
  }
  .cart-item-name{font-weight:700;color:var(--cream);font-size:15px}
  .cart-item-price{color:var(--gold-soft);font-size:13px;margin-top:4px}
  .qty{
    display:flex;align-items:center;gap:8px;direction:ltr;
    background:rgba(0,0,0,.24);border:1px solid var(--line);
    border-radius:999px;padding:4px;
  }
  .qty button{
    width:27px;height:27px;border:0;border-radius:50%;cursor:pointer;
    background:var(--olive-dark);color:var(--cream);font-weight:900;
  }
  .qty span{min-width:18px;text-align:center;color:var(--cream);font-weight:700}
  .cart-foot{
    padding:16px;border-top:1px solid var(--line);
    background:rgba(7,9,7,.9);
  }
  .cart-total{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;font-size:17px;
  }
  .cart-total strong{color:var(--gold-soft);font-size:21px}
  .order-btn{
    width:100%;border:1px solid rgba(201,164,92,.55);border-radius:14px;
    padding:13px;background:linear-gradient(135deg,var(--olive),var(--olive-dark));
    color:var(--cream);font-family:'Tajawal';font-weight:900;cursor:pointer;font-size:15px;
  }

  footer{
    position:relative;z-index:1;text-align:center;padding:30px 20px 46px;
    color:var(--muted);font-size:12px;border-top:1px solid var(--line);
  }
  footer .die-mini{
    width:16px;height:16px;margin:0 auto 10px;border-radius:5px;
    border:1px solid rgba(201,164,92,.55);background:var(--olive-dark);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:2.5px;gap:1px;
  }
  footer .die-mini i{border-radius:50%}
  footer .die-mini i.on{background:var(--gold)}
  footer .brand{
    font-family:'Fraunces',serif;font-weight:600;color:var(--cream);
    letter-spacing:3px;margin-bottom:6px;font-size:13px;
  }

  @media(max-width:480px){
    .hero{padding:28px 14px 25px;min-height:270px}
    .hero .frame{width:150px;height:150px;border-radius:25px}
    .hero .frame .inner{border-radius:22px}
    .hero h1{font-size:30px}
    .menu-wrap{padding:22px 11px 95px}
    .item-row{gap:7px;padding:11px 8px}
    .item-name{font-size:14px}
    .price-chip{min-width:57px;height:33px;font-size:14px}
    .add-hint{width:33px;height:33px;flex-basis:33px;font-size:21px}
    .cart-fab{right:14px;bottom:14px;width:58px;height:58px}
  }
</style>
</head>

function diePips(){
  // classic 5-pip die face pattern for the category marker
  const on = [1,3,4,5,7];
  let html = '';
  for(let i=1;i<=9;i++){ html += `<i class="${on.includes(i) ? 'on' : ''}"></i>`; }
  return html;
}

function renderMenu(){
  const wrap = document.getElementById('menu');
  wrap.innerHTML = '';
  Object.entries(MENU).forEach(([key, cat]) => {
    const section = document.createElement('div');
    section.className = 'category';
    section.id = 'cat-' + key;
    section.innerHTML = `
      <div class="category-title">
        <span class="die">${diePips()}</span>
        <h2>${cat.title}</h2>
        <span class="line"></span>
      </div>
      ${cat.note ? `<div class="category-note">${cat.note}</div>` : ''}
      <div class="rows">
        ${cat.items.map(it => `
          <div class="item-row" data-name="${it.name}" data-price="${it.price}">
            <span class="item-name">${it.name}</span>
            <span class="leader"></span>
            <span class="price-chip">${it.price}<span>ج.م</span></span>
            <span class="add-hint" title="إضافة للسلة">+</span>
          </div>
        `).join('')}
      </div>
    `;
    wrap.appendChild(section);
  });
}
renderMenu();

  });
});

const sections = document.querySelectorAll('.category');
const tabsByCat = {};
document.querySelectorAll('.tab-btn').forEach(b => tabsByCat[b.dataset.cat] = b);
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      const cat = entry.target.id.replace('cat-','');
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(tabsByCat[cat]) tabsByCat[cat].classList.add('active');
    }
  });
}, { rootMargin: '-40% 0px -50% 0px' });
sections.forEach(s => observer.observe(s));

/* ===== V10 CART ===== */
const cart = {};
const cartKey = 'v10_cart';

function loadCart(){
  try{
    const saved=JSON.parse(localStorage.getItem(cartKey)||'{}');
    Object.assign(cart,saved);
  }catch(e){}
}
function saveCart(){localStorage.setItem(cartKey,JSON.stringify(cart))}
function addToCart(name,price){
  const key=name.trim();
  if(!cart[key]) cart[key]={name:key,price:Number(price),qty:0};
  cart[key].qty++;
  saveCart(); updateCart(); openCart();
}
function changeQty(key,delta){
  if(!cart[key]) return;
  cart[key].qty+=delta;
  if(cart[key].qty<=0) delete cart[key];
  saveCart(); updateCart();
}
function updateCart(){
  const entries=Object.entries(cart);
  const count=entries.reduce((s,[,i])=>s+i.qty,0);
  const total=entries.reduce((s,[,i])=>s+i.qty*i.price,0);
  document.getElementById('cartCount').textContent=count;
  document.getElementById('cartCount').classList.toggle('show',count>0);
  document.getElementById('cartTotal').textContent=total;
  const box=document.getElementById('cartItems');
  if(!entries.length){box.innerHTML='<div class="cart-empty">السلة فاضية 🛒<br><small>اضغط + جنب أي مشروب لإضافته</small></div>';return}
  box.innerHTML=entries.map(([key,i])=>`
    <div class="cart-item">
      <div><div class="cart-item-name">${i.name}</div><div class="cart-item-price">${i.price} ج.م × ${i.qty}</div></div>
      <div class="qty"><button onclick="changeQty(${JSON.stringify(key)},1)">+</button><span>${i.qty}</span><button onclick="changeQty(${JSON.stringify(key)},-1)">−</button></div>
    </div>`).join('');
}
function openCart(){document.getElementById('cartDrawer').classList.add('open');document.getElementById('cartOverlay').classList.add('open');document.body.style.overflow='hidden'}
function closeCart(){document.getElementById('cartDrawer').classList.remove('open');document.getElementById('cartOverlay').classList.remove('open');document.body.style.overflow=''}
document.addEventListener('click',e=>{
  const row=e.target.closest('.item-row');
  if(row) addToCart(row.dataset.name,row.dataset.price);
});
document.getElementById('cartFab').onclick=openCart;
document.getElementById('cartClose').onclick=closeCart;
document.getElementById('cartOverlay').onclick=closeCart;
document.getElementById('orderBtn').onclick=()=>{
  const entries=Object.values(cart);
  if(!entries.length)return alert('السلة فاضية، اختار المشروبات الأول.');
  const total=entries.reduce((s,i)=>s+i.price*i.qty,0);
  alert('تم تجهيز طلبك\\n\\n'+entries.map(i=>`• ${i.name} × ${i.qty}`).join('\\n')+`\\n\\nالإجمالي: ${total} ج.م`);
};
loadCart();updateCart();
