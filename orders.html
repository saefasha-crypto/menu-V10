<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>V10 Cafe - الطلبات</title>
<style>
:root{--bg:#090b09;--panel:#111510;--olive:#66734b;--gold:#c9a45c;--cream:#f5f0e5;--muted:#a7aa9f;--line:rgba(245,240,229,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(102,115,75,.2),transparent 40%),#090b09;color:var(--cream);font-family:Arial,sans-serif}
header{padding:18px;border-bottom:1px solid var(--line);background:#0b0d0b;position:sticky;top:0;z-index:5}
.header{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px}.sub{color:var(--muted);font-size:12px;margin-top:4px}
.status{color:#bfc8ad;font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#718653;margin-left:6px}
main{max-width:900px;margin:auto;padding:25px 15px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.top h2{font-size:24px}.top p{color:var(--muted);font-size:13px;margin-top:4px}
button{font-family:inherit;cursor:pointer}
.clear{padding:9px 13px;border:1px solid rgba(201,164,92,.3);border-radius:10px;background:rgba(201,164,92,.06);color:#e2c98e}
#orders{display:grid;gap:13px}
.empty{text-align:center;padding:70px 20px;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}
.order{background:linear-gradient(135deg,#171c17,#0e110e);border:1px solid rgba(245,240,229,.08);border-radius:18px;overflow:hidden}
.order.new{border-color:#c9a45c;box-shadow:0 0 20px rgba(201,164,92,.12)}
.head{padding:15px;display:flex;justify-content:space-between;background:rgba(102,115,75,.1);border-bottom:1px solid var(--line)}
.table{font-size:18px;font-weight:bold}.time{color:var(--muted);font-size:11px;margin-top:4px}
.badge{display:none;background:var(--gold);color:#17170f;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold}
.new .badge{display:block}
.items{padding:4px 15px}.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border:0}.name{font-weight:bold}.price{color:#e2c98e}
.foot{padding:13px 15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.total{font-size:17px;font-weight:bold}.total span{color:#e2c98e}
.done{padding:10px 15px;border:0;border-radius:10px;background:var(--olive);color:var(--cream);font-weight:bold}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.overlay.show{display:flex}.alert{background:#151b15;border:1px solid #c9a45c;border-radius:22px;padding:30px;text-align:center;width:min(390px,100%)}
.bell{font-size:50px}.alert h2{color:#e2c98e;margin:10px}.alert p{color:var(--muted);margin-bottom:20px}
.receive{padding:11px 25px;border:0;border-radius:12px;background:var(--olive);color:white;font-weight:bold}
@media(max-width:550px){.status{display:none}.top{align-items:flex-start}.foot{flex-direction:column;gap:10px}.done{width:100%}}
</style>
</head>
<body>
<header><div class="header"><div><h1>V10 Cafe</h1><div class="sub">شاشة استقبال الطلبات</div></div><div style="display:flex;gap:8px;align-items:center"><button id="soundBtn" class="clear">🔔 تفعيل الصوت</button><div class="status"><span class="dot"></span>جاهز لاستقبال الطلبات</div></div></div></header>
<main>
<div class="top"><div><h2>الطلبات</h2><p>الطلبات الجديدة هتظهر هنا بعد الربط.</p></div><button class="clear" onclick="clearOrders()">مسح الكل</button></div>
<section id="orders"></section>
</main>
<div class="overlay" id="overlay"><div class="alert"><div class="bell">🔔</div><h2>طلب جديد!</h2><p id="alertText"></p><button class="receive" onclick="closeAlert()">استلام الطلب</button></div></div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDUmD3X5g2eSy5eL3U9R3IPZHnoWfpmYwI",
    authDomain: "coffee-v10.firebaseapp.com",
    databaseURL: "https://coffee-v10-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "coffee-v10",
    storageBucket: "coffee-v10.firebasestorage.app",
    messagingSenderId: "1056868199469",
    appId: "1:1056868199469:web:e9a14e13085daaadb99ca4",
    measurementId: "G-YC445CVSKK"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const ordersRef = ref(db, 'orders');

  let orders = [];
  let audioCtx = null;
  let soundEnabled = false;
  let knownIds = new Set();
  let firstSnapshot = true;

  function enableSound(){
    try{
      const C = window.AudioContext || window.webkitAudioContext;
      if(!C) return;
      if(!audioCtx) audioCtx = new C();
      audioCtx.resume();
      soundEnabled = true;
      document.getElementById('soundBtn').textContent = '🔊 الصوت مفعّل';
    }catch(e){}
  }

  function sound(){
    if(!soundEnabled || !audioCtx) return;
    try{
      audioCtx.resume();
      const now = audioCtx.currentTime;
      [880, 660, 880].forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + index * 0.22);
        gain.gain.exponentialRampToValueAtTime(0.22, now + index * 0.22 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.22 + 0.18);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + index * 0.22);
        osc.stop(now + index * 0.22 + 0.2);
      });
    }catch(e){}
  }

  function formatTime(ts){
    if(!ts) return 'الآن';
    const d = new Date(ts);
    if(Number.isNaN(d.getTime())) return 'الآن';
    return d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  }

  function render(){
    const box = document.getElementById("orders");
    if(!orders.length){
      box.innerHTML = '<div class="empty">☕<br><br>مفيش طلبات حاليًا</div>';
      return;
    }

    box.innerHTML = orders.map(o => {
      const total = Number(o.total ?? (o.items || []).reduce((s,x)=>s + Number(x.price)*Number(x.qty),0));
      return `<article class="order ${o.isNew ? 'new' : ''}">
        <div class="head">
          <div>
            <div class="table">🍽️ ترابيزة ${o.table || '-'}</div>
            <div class="time">${formatTime(o.createdAt)}</div>
          </div>
          <div class="badge">طلب جديد</div>
        </div>
        <div class="items">
          ${(o.items || []).map(x => `<div class="item">
            <div class="name">${x.name} × ${x.qty}</div>
            <div class="price">${Number(x.price)*Number(x.qty)} ج.م</div>
          </div>`).join("")}
        </div>
        <div class="foot">
          <div class="total">الإجمالي: <span>${total} ج.م</span></div>
          <button class="done" onclick="completeOrder('${o.id}')">تم تجهيز الطلب ✓</button>
        </div>
      </article>`;
    }).join("");
  }

  window.completeOrder = async function(id){
    try{
      await remove(ref(db, 'orders/' + id));
    }catch(e){
      alert('حصلت مشكلة في حذف الطلب.');
    }
  };

  window.clearOrders = async function(){
    if(!orders.length) return;
    if(confirm("متأكد إنك عايز تمسح كل الطلبات؟")){
      try{
        await remove(ordersRef);
      }catch(e){
        alert('حصلت مشكلة في مسح الطلبات.');
      }
    }
  };

  window.closeAlert = function(){
    document.getElementById("overlay").classList.remove("show");
    orders.forEach(x => x.isNew = false);
    render();
  };

  onValue(ordersRef, snapshot => {
    const data = snapshot.val() || {};
    const incoming = Object.entries(data).map(([id, o]) => ({...o, id}));
    incoming.sort((a,b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));

    if(!firstSnapshot){
      const newOnes = incoming.filter(o => !knownIds.has(o.id));
      if(newOnes.length){
        const newest = newOnes[0];
        newest.isNew = true;
        document.getElementById("alertText").textContent = "وصل طلب جديد من ترابيزة " + (newest.table || '-');
        document.getElementById("overlay").classList.add("show");
        sound();
      }
    }

    knownIds = new Set(incoming.map(o => o.id));
    orders = incoming;
    render();
    firstSnapshot = false;
  });

  document.getElementById('soundBtn').addEventListener('click', enableSound);
  render();
</script>
</body>
</html>
